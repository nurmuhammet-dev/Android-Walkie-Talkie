name: Android CI Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: gradle

    - name: Fix line endings and upgrade Gradle to 6.1.1
      run: |
        sed -i 's/\r$//' gradlew
        chmod +x gradlew
        
        # Обновляем версию Gradle на стабильную 6.1.1
        sed -i 's/gradle-3.3-all.zip/gradle-6.1.1-all.zip/g' gradle/wrapper/gradle-wrapper.properties
        
        # Жестко включаем поддержку AndroidX в свойствах Gradle
        cat << 'EOF' > gradle.properties
        android.useAndroidX=true
        android.enableJetifier=true
        EOF
        
        # Переписываем корневой build.gradle на совместимый плагин 4.0.1
        cat << 'EOF' > build.gradle
        buildscript {
            repositories { google(); mavenCentral() }
            dependencies { classpath 'com.android.tools.build:gradle:4.0.1' }
        }
        allprojects {
            repositories { google(); mavenCentral() }
        }
        task clean(type: Delete) { delete rootProject.buildDir }
        EOF

        # Исправляем внутренний app/build.gradle под стандарты AndroidX
        cat << 'EOF' > app/build.gradle
        apply plugin: 'com.android.application'
        android {
            compileSdkVersion 30
            defaultConfig {
                applicationId "com.example.gms298.walkietalkie"
                minSdkVersion 19
                targetSdkVersion 30
                versionCode 1
                versionName "1.0"
            }
            buildTypes {
                release {
                    minifyEnabled false
                    proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
                }
            }
        }
        dependencies {
            implementation fileTree(dir: 'libs', include: ['*.jar'])
            implementation 'androidx.appcompat:appcompat:1.2.0'
            implementation 'androidx.constraintlayout:constraintlayout:2.0.4'
        }
        EOF

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
